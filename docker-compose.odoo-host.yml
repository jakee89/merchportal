services:
  storefront:
    image: ghcr.io/jakee89/merchportal-storefront:${MERCHPORTAL_IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:8100:8000"
    mem_limit: 768m

  backend:
    image: ghcr.io/jakee89/merchportal-backend:${MERCHPORTAL_IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:9100:9000"
    environment:
      S3_ENDPOINT: http://minio:8333
    mem_limit: 1200m

  worker:
    image: ghcr.io/jakee89/merchportal-backend:${MERCHPORTAL_IMAGE_TAG:-latest}
    environment:
      S3_ENDPOINT: http://minio:8333
      NODE_OPTIONS: --max-old-space-size=1536
    mem_limit: 2g
    cpus: 1.25
    cpu_shares: 256

  postgres:
    mem_limit: 384m

  redis:
    mem_limit: 128m

  typesense:
    healthcheck: !override
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8108"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  minio:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data", "-admin.port=22646"]
    environment: !override
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-merchportal}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_BUCKET:-merchportal}
    volumes: !override
      - seaweed_data:/data
    ports: !override []
    healthcheck: !override
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 384m

  minio-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/true"]
    mem_limit: 64m

volumes:
  seaweed_data:
