name: merchportal

services:
  storefront:
    build:
      context: .
      dockerfile: docker/storefront.Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_setup_required}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-mt}
        NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-pk_setup_required}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-mt}
      NEXT_PUBLIC_BASE_URL: ${STOREFRONT_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/portal').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MEDUSA_BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "pnpm exec medusa db:migrate && pnpm start"]
    environment: &backend-environment
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-merchportal}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-merchportal}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET}
      STORE_CORS: ${STOREFRONT_URL:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_URL:-http://localhost:9000}
      AUTH_CORS: ${STOREFRONT_URL:-http://localhost:8000},${ADMIN_URL:-http://localhost:9000}
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      MEDUSA_BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
      TYPESENSE_HOST: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-merchportal}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-merchportal}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        MEDUSA_BACKEND_URL: ${BACKEND_URL:-http://localhost:9000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.exit(process.env.MEDUSA_WORKER_MODE === 'worker' ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merchportal}
      POSTGRES_USER: ${POSTGRES_USER:-merchportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      [
        "--data-dir",
        "/data",
        "--api-key=${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}",
        "--enable-cors=false",
      ]
    volumes:
      - typesense_data:/data
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-merchportal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  minio_data:
